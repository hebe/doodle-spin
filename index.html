<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doodle Spin</title>
<meta name="theme-color" content="#fbf8ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#23211d" media="(prefers-color-scheme: dark)">
<!-- Static icon files live in /icons/. -->
<link rel="icon" href="/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/icons/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter></svg>
<div class="app">

<!-- 1. Spin -->
<section class="view active" data-view="home" aria-label="Spin">
  <header class="bar"><span></span><h1 class="title"><span>Doodle Spin</span></h1>
    <button class="icon right" id="sound" type="button" aria-pressed="true" aria-label="Sound off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="on" d="M16 9q3 3 0 6M19 6q6 6 0 12"/><path class="off" d="M16 9l6 6M22 9l-6 6"/></svg></button></header>
  <div class="view-body">
    <p class="sub">Pull the lever, then draw what lands.</p>
    <div class="machine" id="reels">
      <div class="reel"><div class="win" role="img" aria-label="Thing"></div><button class="chip" type="button" aria-pressed="false">hold</button></div>
      <div class="reel"><div class="win" role="img" aria-label="Face"></div><button class="chip" type="button" aria-pressed="false">hold</button></div>
      <div class="reel"><div class="win" role="img" aria-label="Extra"></div><button class="chip" type="button" aria-pressed="false">hold</button></div>
      <button class="lever" id="lever" type="button" aria-label="Pull the lever (Space)"><span class="ball"></span><span class="stem"></span></button>
    </div>
    <p class="status-line" id="note" role="status">Pull the lever!</p>
  </div>
  <footer class="view-foot">
    <button class="btn" id="primary" type="button">Spin!</button>
    <button class="btn alt" id="again" type="button" hidden>Spin again</button>
    <nav class="links" aria-label="More">
      <button class="link" type="button" data-go="gallery">gallery</button>
      <button class="link" type="button" data-go="catalog">all doodles</button>
      <button class="link guest-only" type="button" data-go="login">boss mode</button>
      <button class="link boss-only" type="button" id="logout">log out</button>
    </nav>
  </footer>
</section>

<!-- 2. Draw -->
<section class="view" data-view="draw" aria-label="Your prompt">
  <header class="bar"><button class="icon" data-back aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Your prompt</h2><span></span></header>
  <div class="view-body">
    <p class="note big" id="sentence"></p>
    <div class="tiles" id="tiles"></div>
    <p class="sub">Grab some paper and a pen.</p>
  </div>
  <footer class="view-foot">
    <button class="btn alt boss-only" type="button" data-go="camera">Photograph mine</button>
    <button class="btn alt boss-only" type="button" id="make-example">Stuck? Show an example</button>
    <button class="btn alt" type="button" id="share">Share this roll</button>
    <button class="link" type="button" data-back>Spin again</button>
  </footer>
</section>

<!-- 3. Example (AI) -->
<section class="view" data-view="example" aria-label="Example">
  <header class="bar"><button class="icon" data-back aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Example</h2><span></span></header>
  <div class="view-body">
    <div class="result card" id="example-result" hidden>
      <img id="example-img" alt="">
      <p id="example-caption"></p>
    </div>
    <p class="spinner" id="example-spinner" aria-hidden="true">✎</p>
    <p class="status" id="example-status" role="status" aria-live="polite"></p>
  </div>
  <footer class="view-foot">
    <a class="btn alt" id="example-save" download hidden>Save image</a>
    <button class="btn" type="button" id="example-retry" hidden>Try again</button>
    <button class="link" type="button" data-back>Back to prompt</button>
  </footer>
</section>

<!-- 4. Camera -->
<section class="view" data-view="camera" aria-label="Photograph your version">
  <header class="bar"><button class="icon" data-back aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Your version</h2><span></span></header>
  <div class="view-body">
    <div class="stage" id="stage"><p id="stage-hint">Draw it on paper, then snap it.</p></div>
    <canvas id="canvas" hidden></canvas>
    <p class="status" id="camera-status" role="status"></p>
  </div>
  <footer class="view-foot">
    <button class="btn" type="button" id="cam-open">Open camera</button>
    <button class="btn" type="button" id="cam-shoot" hidden>Take photo</button>
    <button class="btn" type="button" id="cam-save" hidden>Save to gallery</button>
    <button class="btn alt" type="button" id="cam-retake" hidden>Retake</button>
    <button class="btn" type="button" id="cam-gallery" hidden>See gallery</button>
  </footer>
</section>

<!-- 5. Gallery -->
<section class="view" data-view="gallery" aria-label="Gallery">
  <header class="bar"><button class="icon" data-back aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Gallery</h2><button class="chip right" id="favorites" type="button">favorites</button></header>
  <div class="view-body scroll">
    <p class="status" id="gallery-status" role="status"></p>
    <div id="saved-grid" class="saved-grid"></div>
  </div>
</section>

<!-- 6. Catalog -->
<section class="view" data-view="catalog" aria-label="All doodles">
  <header class="bar"><button class="icon" data-back aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2>All doodles</h2><span></span></header>
  <div class="tabs" id="catalog-tabs" role="group" aria-label="Category"></div>
  <div class="view-body scroll" id="catalog-body"></div>
</section>

<!-- 7. Boss login -->
<section class="view" data-view="login" aria-label="Boss mode">
  <header class="bar"><button class="icon" data-back aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Boss mode</h2><span></span></header>
  <div class="view-body">
    <p class="sub">Unlock to make examples, photograph your drawings and manage the gallery.</p>
    <form class="login" id="login-form">
      <label class="sr" for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="password" required>
      <button class="btn" type="submit">Unlock</button>
      <p class="status" id="login-status" role="status"></p>
    </form>
  </div>
</section>

</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
