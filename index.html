<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doodle Slot Machine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<style>
:root{--paper:#fbf8ee;--ink:#1c1b1f;--accent:#f2a20f;--dot:#cfc8b0;--soft:#f1ebd6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#23211d;--ink:#f3eedd;--accent:#f5b13a;--dot:#4a463c;--soft:#2d2a24;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#23211d;--ink:#f3eedd;--accent:#f5b13a;--dot:#4a463c;--soft:#2d2a24;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font:20px/1.3 'Patrick Hand','Segoe Print','Comic Sans MS',cursive;display:flex;overflow-y:auto}
main{margin:auto;width:min(100%,780px);padding:18px 12px 28px;text-align:center}
h1{margin:0;font-size:clamp(36px,10vw,52px);font-weight:400;line-height:1;transform:rotate(-1.5deg)}
h1 span{background:linear-gradient(transparent 60%,var(--accent) 60% 92%,transparent 92%);padding:0 8px}
.sub{margin:8px 0 6px;opacity:.8}
.machine{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 36px;gap:10px;padding:14px 10px 12px 12px;border:3px solid var(--ink);border-radius:30px 24px 32px 22px/24px 32px 22px 30px;background:var(--paper);box-shadow:6px 7px 0 var(--ink)}
.reel{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.win{width:100%;aspect-ratio:1;border:3px solid var(--ink);border-radius:16px 12px 18px 12px;background:var(--soft);padding:2px;display:grid;place-items:center;overflow:hidden;color:var(--ink)}
.win svg{width:100%;height:100%;filter:url(#wob)}
.win.spin svg{filter:blur(2.5px);animation:jit .16s linear infinite}
.win.land{animation:land .4s cubic-bezier(.3,1.6,.5,1)}
.a{fill:var(--accent)}.p{fill:var(--paper)}.k{fill:currentColor}
.hold{font:inherit;font-size:17px;padding:1px 14px;border:2px solid var(--ink);border-radius:999px;background:transparent;color:inherit;cursor:pointer}
.hold[aria-pressed="true"]{background:var(--accent);color:#1c1b1f}
.hold:disabled{opacity:.5;cursor:default}
.lever{grid-column:4;align-self:center;display:flex;flex-direction:column;align-items:center;padding:0;border:0;background:none;color:inherit;cursor:pointer;transform-origin:center}
.lever.pull{animation:pull .55s ease-in-out}
.ball{width:30px;height:30px;border-radius:50%;background:var(--accent);border:3px solid var(--ink)}
.stem{width:8px;height:86px;margin-top:-2px;background:var(--ink);border-radius:4px}
#note{margin:24px auto 0;padding:12px 18px;max-width:92%;background:var(--accent);color:#1c1b1f;border:3px solid var(--ink);border-radius:6px 12px 6px 14px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-1.2deg);font-size:26px;line-height:1.2}
.row{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:20px}
.big{font:inherit;font-size:28px;padding:8px 30px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:inherit;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.big:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.big:disabled{opacity:.55;cursor:default}
.hint{margin:16px 0 0;font-size:17px;opacity:.7}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
@keyframes jit{50%{transform:translateY(9px)}}
@keyframes land{0%{transform:translateY(-14px) scale(.95)}100%{transform:none}}
@keyframes pull{0%{transform:scaleY(1)}35%{transform:scaleY(-1)}100%{transform:scaleY(1)}}
h2{font-weight:400;font-size:28px;margin:22px 0 10px;text-align:left}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.cell{display:flex;flex-direction:column;gap:2px;font-size:16px;line-height:1.1}
.pic{aspect-ratio:1;border:2px solid var(--ink);border-radius:14px 10px 16px 10px;background:var(--soft);padding:2px;display:grid;place-items:center;color:var(--ink)}
.pic svg{width:100%;height:100%;filter:url(#wob)}
body.gal .machine,body.gal #note,body.gal .big,body.gal .hint,body.gal .sub{display:none}
@media (min-width:600px){.machine{gap:18px;padding:26px 22px 22px 26px;grid-template-columns:repeat(3,minmax(0,1fr)) 54px;border-radius:40px 32px 42px 30px/32px 42px 30px 40px}.win{border-radius:24px 18px 26px 18px;padding:6px}.ball{width:44px;height:44px}.stem{width:11px;height:130px}.hold{font-size:22px;padding:2px 20px}#note{font-size:34px}.big{font-size:34px}.sub{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter></svg>
<main>
<h1><span>Doodle slot</span></h1>
<p class="sub">Pull the lever, then draw what lands.</p>
<div class="machine" id="m">
<div class="reel"><div class="win" role="img" aria-label="Object"></div><button class="hold" aria-pressed="false">hold</button></div>
<div class="reel"><div class="win" role="img" aria-label="Expression"></div><button class="hold" aria-pressed="false">hold</button></div>
<div class="reel"><div class="win" role="img" aria-label="Accessory"></div><button class="hold" aria-pressed="false">hold</button></div>
<button class="lever" id="lv" aria-label="Pull the lever"><span class="ball"></span><span class="stem"></span></button>
</div>
<div id="note">Pull the lever!</div>
<div class="row"><button class="big" id="go">Pull</button><button class="hold" id="mu" aria-pressed="true">sound off</button><button class="hold" id="gv">all doodles</button></div>
<p class="hint">Space also pulls. Hold a reel to keep it and re-spin the rest.</p>
<section id="gal" hidden></section>
</main>

['with a flower',S('<circle cx="50" cy="26" r="13" class="p"/><circle cx="74" cy="44" r="13" class="p"/><circle cx="65" cy="72" r="13" class="p"/><circle cx="35" cy="72" r="13" class="p"/><circle cx="26" cy="44" r="13" class="p"/><circle cx="50" cy="52" r="10" class="a"/>')],
['in a beanie',S('<path d="M20 70q0-44 30-44t30 44z" class="a"/><path d="M16 70h68v12H16z" class="p"/><path d="M26 70v12M38 70v12M50 70v12M62 70v12M74 70v12"/><circle cx="50" cy="22" r="8" class="p"/>')],
['in a cape',S('<path d="M28 20q22-8 44 0l14 68H14z" class="a"/><path d="M28 20q22 12 44 0"/><circle cx="50" cy="26" r="5" class="p"/>')],
['with a plaster on',S('<g transform="rotate(-20 50 50)"><rect x="10" y="34" width="80" height="32" rx="16" class="a"/><rect x="36" y="34" width="28" height="32" class="p"/><path d="M44 46h.1M52 46h.1M44 54h.1M52 54h.1" stroke-width="5"/></g>')],
['holding a balloon',S('<path d="M50 8c-22 0-30 22-26 38 4 14 16 20 26 20s22-6 26-20c4-16-4-38-26-38z"/><path d="M46 66l4 7 4-7z"/><path d="M50 73q-9 8 0 14t0 11"/>')]];
const R=[OBJ,EXP,ACC],$=s=>document.querySelector(s),wins=[...document.querySelectorAll('.win')],holds=[...document.querySelectorAll('.reel .hold')];
const rnd=n=>Math.random()*n|0,held=i=>holds[i].getAttribute('aria-pressed')==='true';
let cur=R.map(a=>rnd(a.length)),busy=false,mute=true,ac=null;
const show=(i,k)=>{wins[i].innerHTML=R[i][k][1]};
function tone(f,d,t,v,w){if(mute||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(w||0);o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.06,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
function setBusy(b){busy=b;$('#go').disabled=b;holds.forEach(h=>h.disabled=b)}
function done(){
 setBusy(false);
 const n=[0,1,2].map(i=>R[i][cur[i]]);
 $('#note').textContent='Draw '+(/^[aeiou]/.test(n[1][0])?'an ':'a ')+n[1][0]+' '+n[0][0]+' '+n[2][0];
}
function pull(){
 if(busy)return;
 if(holds.every((h,i)=>held(i))){$('#note').textContent='Unhold a reel to spin.';return}
 try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}
 setBusy(true);
 const lv=$('#lv');lv.classList.remove('pull');void lv.offsetWidth;lv.classList.add('pull');
 $('#note').textContent='Spinning\u2026';
 tone(140,.2,'square',.04);
 const first=[0,1,2].find(i=>!held(i));let left=[0,1,2].filter(i=>!held(i)).length;
 [0,1,2].forEach(i=>{
  if(held(i))return;
  const w=wins[i],target=rnd(R[i].length);w.classList.add('spin');
  const iv=setInterval(()=>{show(i,rnd(R[i].length));if(i===first)tone(650+rnd(350),.03,'triangle',.025)},75);
  setTimeout(()=>{
   clearInterval(iv);cur[i]=target;show(i,target);w.classList.remove('spin');w.classList.add('land');
   setTimeout(()=>w.classList.remove('land'),420);
   tone(150,.18,'square',.05);tone(330*[1,1.25,1.5][i],.3,'sine',.08);
   if(--left===0)done();
  },850+i*420+rnd(200));
 });
}
holds.forEach(h=>h.addEventListener('click',()=>{const on=!held(holds.indexOf(h));h.setAttribute('aria-pressed',on);h.textContent=on?'held':'hold';tone(on?520:380,.08,'triangle',.04)}));
$('#go').addEventListener('click',pull);$('#lv').addEventListener('click',pull);
$('#mu').addEventListener('click',e=>{mute=!mute;e.target.setAttribute('aria-pressed',mute);e.target.textContent=mute?'sound off':'sound on'});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();pull()}});
function buildGal(){$('#gal').innerHTML=[['Things',0],['Faces',1],['Extras',2]].map(t=>'<h2>'+t[0]+' ('+R[t[1]].length+')</h2><div class="grid">'+R[t[1]].map(x=>'<div class="cell"><div class="pic">'+x[1]+'</div><span>'+x[0]+'</span></div>').join('')+'</div>').join('')}
$('#gv').addEventListener('click',e=>{const on=document.body.classList.toggle('gal');$('#gal').hidden=!on;e.target.textContent=on?'back to slot':'all doodles';if(on&&!$('#gal').innerHTML)buildGal();document.body.scrollTo(0,0);window.scrollTo(0,0)});
cur.forEach((k,i)=>show(i,k));
</script>
